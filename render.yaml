# Render blueprint: web service + managed Postgres.
# Create the Cloudinary and admin secrets in the Render dashboard - they are
# marked sync:false so they are never committed to git.
services:
  - type: web
    name: announcements-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: announcements-db
          property: connectionString
      # The exact Vercel domain, no trailing slash. CORS is locked to this.
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: announcements
      # Bootstrap admin: set these once, then blank ADMIN_PASSWORD after the
      # first successful deploy so it is not sitting in the dashboard.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: announcements-db
    plan: free
    region: singapore
    databaseName: announcements
    user: announcements
